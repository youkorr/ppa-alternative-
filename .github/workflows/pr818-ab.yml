#
# The A/B benchmark of esp-iot-solution PR 818 (espressif/pr818-ab), built for
# a Waveshare 7B and a Tab5, for the adapter as Espressif ships it and for the
# branch given -- the same benchmark code in both, so the two can be compared
# line for line. native-ram80 is the branch with the camera picture turned
# through 80 KiB of internal RAM (CONFIG_ESP_LVGL_ADAPTER_ROTATE_VIDEO_RAM_KB). Each artifact is one .bin to write at 0x0; the serial log, at
# 115200 bauds, runs from AB_READY to AB_DONE in two to four minutes.
name: PR 818 A/B benchmark firmwares
run-name: PR 818 A/B, ${{ inputs.ref || 'test/rotate-in-draw-sync' }} against ${{ inputs.official || 'da53cfa' }}
on:
  push:
    paths:
      - "espressif/pr818-ab/**"
      - ".github/workflows/pr818-ab.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of youkorr/esp-iot-solution with the PR's adapter"
        default: test/rotate-in-draw-sync
      official:
        description: "Commit of esp-iot-solution with Espressif's adapter (da53cfa is the V7-V9 kits' base)"
        default: da53cfaa90b63085ef21f721f7593b5e2747d448
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: espressif/idf:v5.5.6
    env:
      NAME: ${{ matrix.board }}-ab-${{ matrix.variant }}
      # Espressif's camera stack for the camera scene (esp_video, esp_cam_sensor,
      # esp_ipa), at one commit so both variants are built on the same one.
      VIDEO_COMMIT: 3bb32ee9ee42b35cfbfeb64ecbc38a7a2222dd71
    strategy:
      fail-fast: false
      matrix:
        board: [waveshare-7b, tab5]
        variant: [official, native, native-ram80]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ppa
      - uses: actions/checkout@v4
        with:
          repository: youkorr/esp-iot-solution
          ref: ${{ matrix.variant == 'official' && (inputs.official || 'da53cfaa90b63085ef21f721f7593b5e2747d448') || (inputs.ref || 'test/rotate-in-draw-sync') }}
          path: iots
          sparse-checkout: |
            components/display/tools/esp_lvgl_adapter
            components/display/lcd/esp_lcd_ek79007
            components/button
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-video-components
          ref: ${{ env.VIDEO_COMMIT }}
          path: video
          sparse-checkout: |
            esp_video
            esp_cam_sensor
            esp_ipa
            esp_sccb_intf
      - name: Prepare ${{ matrix.board }}, ${{ matrix.variant }}
        shell: bash
        run: |
          set -e
          git config --global --add safe.directory '*'
          # The image is a git checkout of ESP-IDF, which has no version.txt;
          # the scanout probe is audited for v5.5.6 exactly and checks it.
          [ -f "$IDF_PATH/version.txt" ] || git -C "$IDF_PATH" describe --tags --exact-match > "$IDF_PATH/version.txt"
          cat "$IDF_PATH/version.txt"
          VARIANT=${{ matrix.variant }}
          RAM=0
          if [ "$VARIANT" = native-ram80 ]; then VARIANT=native; RAM=80; fi
          python3 ppa/espressif/pr818-ab/prepare.py --repo iots --ref HEAD --variant $VARIANT \
            --board ${{ matrix.board }} --idf "$IDF_PATH" --out work --video video --video-ram $RAM
      - name: Build
        shell: bash
        run: |
          set -e
          . "$IDF_PATH/export.sh" > /dev/null
          cd work/components/display/tools/esp_lvgl_adapter/test_apps/lvgl9
          idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.bench;sdkconfig.ab' -D IDF_TARGET=esp32p4 build
          if [ "${{ matrix.variant }}" = native-ram80 ]; then
            grep -E "^CONFIG_ESP_LVGL_ADAPTER_ROTATE_IN_DRAW=y" sdkconfig
            grep -E "^CONFIG_ESP_LVGL_ADAPTER_ROTATE_VIDEO_RAM_KB=80" sdkconfig
          elif [ "${{ matrix.variant }}" = native ]; then
            grep -E "^CONFIG_ESP_LVGL_ADAPTER_ROTATE_IN_DRAW=y" sdkconfig
            ! grep -E "^CONFIG_ESP_LVGL_ADAPTER_ROTATE_VIDEO_RAM_KB=[1-9]" sdkconfig
          else
            ! grep -E "^CONFIG_ESP_LVGL_ADAPTER_ROTATE_IN_DRAW=y" sdkconfig
          fi
          # Merged as the V9 kit's were: DIO at 40 MHz, the board's flash size.
          SIZE=$([ "${{ matrix.board }}" = tab5 ] && echo 16MB || echo 32MB)
          cd build
          python3 - "$GITHUB_WORKSPACE/$NAME.bin" "$SIZE" <<'EOF'
          import json, subprocess, sys
          files = json.load(open('flasher_args.json'))['flash_files']
          segs = [x for off in sorted(files, key=lambda o: int(o, 16)) for x in (off, files[off])]
          subprocess.run([sys.executable, '-m', 'esptool', '--chip', 'esp32p4', 'merge_bin', '-o', sys.argv[1],
                          '--flash_mode', 'dio', '--flash_freq', '40m', '--flash_size', sys.argv[2], *segs], check=True)
          EOF
          cp ../sdkconfig "$GITHUB_WORKSPACE/sdkconfig-$NAME"
          cp test_esp_lvgl_adapter_lvgl9.elf "$GITHUB_WORKSPACE/$NAME.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.bin
            sdkconfig-${{ env.NAME }}
            ${{ env.NAME }}.elf
