#
# Temporary: a real ESP-IDF build of a Guition JC8012P4A1 with youkorr/lvgl_9.5
# (the branch that drops the patched lv_freertos.c), youkorr/esphome's
# esp_video_camera and lvgl_camera_display, and youkorr/face_detection. Proves
# what esphome config cannot: that LVGL now compiles in ESPHome's native
# ESP-IDF build, and links beside the camera and the face models.
name: face_detection build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lvgl: [claude/native-idf-lv-freertos]
        ppa: [plain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "git+https://github.com/esphome/esphome@dev"
      - run: esphome version
      - name: The configuration
        run: |
          mkdir fd
          cp yaml/boards/guition.yaml fd/guition.yaml
          cat > fd/fd.yaml <<YAML
          esphome:
            name: camera-test-guition
          packages:
            board: !include guition.yaml
          external_components:
            - source:
                type: git
                url: https://github.com/youkorr/lvgl_9.5
                ref: ${{ matrix.lvgl }}
              components: [lvgl]
              refresh: 0s
            - source:
                type: git
                url: https://github.com/youkorr/esphome
                ref: esp_video_camera-lvgl
              components: [esp_video_camera, lvgl_camera_display]
              refresh: 0s
            - source:
                type: git
                url: https://github.com/youkorr/face_detection
                ref: claude/face-detection-check
              components: [face_detection]
              refresh: 0s
          logger:
          i2c:
            - id: i2c_bus
              sda: GPIO7
              scl: GPIO8
          esp_video_camera:
            id: cam
            name: Camera
            i2c_id: i2c_bus
            device: jpeg
          lvgl:
            displays: [panel]
            color_depth: 16
            byte_order: little_endian
          LVGL_EXTRA
            pages:
              - id: main_page
                widgets:
                  - canvas:
                      id: cam_canvas
                      width: 640
                      height: 480
          lvgl_camera_display:
            camera_id: cam
            canvas_id: cam_canvas
          face_detection:
            id: faces
            camera_id: cam
            recognition_enabled: true
            face_db_path: /sdcard/faces/faces.db
            unknown_label: "Inconnu"
          YAML
          if [ "${{ matrix.ppa }}" = ppa ]; then
            sed -i 's/^LVGL_EXTRA$/  use_ppa: true\n  perf_monitor: true/' fd/fd.yaml
          else
            sed -i '/^LVGL_EXTRA$/d' fd/fd.yaml
          fi
          cat fd/fd.yaml
      - name: esphome compile
        run: |
          set -o pipefail
          esphome compile fd/fd.yaml 2>&1 | tee build.log
      - name: What went into the firmware
        if: always()
        run: |
          set -x
          B=fd/.esphome/build/camera-test-guition
          ls $B/src/esphome/components/lvgl/ | grep -i freertos || echo "no lv_freertos.c in src"
          grep -n "lv_freertos\|lv_os_private" build.log | head || true
          MAP=$B/build/camera-test-guition.map
          grep -n "lv_thread_init" "$MAP" | head -5 || true
          ls -la $B/build/*.bin || true
