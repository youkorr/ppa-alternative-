#
# Espressif's esp_lvgl_adapter test app (test_apps/lvgl9), from the branch of
# esp-iot-solution PR #818, built on ESP-IDF v5.5.5 for two boards by
# espressif/<board>/prepare.py: a Waveshare ESP32-P4-WIFI6-Touch-LCD-7B at
# rotation 90 and 180, an M5Stack Tab5 (ILI9881C) at 270. Firmwares identical
# but for one option:
#
#   rotate_in_draw   CONFIG_ESP_LVGL_ADAPTER_ROTATE_IN_DRAW, the PR
#   copy             the adapter as it is today: drawn upright, copied rotated,
#                    with Espressif's PPA hang patch on ESP-IDF if it applies
#
# Each artifact is one .bin to write at 0x0. The tests start at boot; the
# serial log says "BENCH ... ms each" and each test's PASS or FAIL.
name: Espressif test app on a Waveshare 7B and a Tab5
run-name: Espressif test app, ESP-IDF ${{ inputs.idf || 'v5.5.5' }}, ${{ inputs.ref || 'feat/esp_lvgl_adapter-rotate-in-draw' }}
on:
  push:
    paths:
      - "espressif/**"
      - ".github/workflows/espressif-test-app.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of youkorr/esp-iot-solution to build"
        default: feat/esp_lvgl_adapter-rotate-in-draw
      idf:
        description: "ESP-IDF, a tag of the espressif/idf image (v5.5.5 is what ESPHome builds with)"
        default: v5.5.5
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: espressif/idf:${{ inputs.idf || 'v5.5.5' }}
    strategy:
      fail-fast: false
      matrix:
        board: [waveshare-7b, tab5]
        mode: [rotate_in_draw, copy]
        angle: ["90", "180", "270"]
        exclude:
          - board: waveshare-7b
            angle: "270"
          - board: tab5
            angle: "90"
          - board: tab5
            angle: "180"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ppa
      - uses: actions/checkout@v4
        with:
          repository: youkorr/esp-iot-solution
          ref: ${{ inputs.ref || 'feat/esp_lvgl_adapter-rotate-in-draw' }}
          path: iots
          sparse-checkout: |
            components/display/tools/esp_lvgl_adapter
            components/display/lcd/esp_lcd_ek79007
            components/button
      - name: Prepare for ${{ matrix.board }}, mode ${{ matrix.mode }}, rotation ${{ matrix.angle }}
        shell: bash
        run: |
          set -e
          ADAPTER=$PWD/iots/components/display/tools/esp_lvgl_adapter
          if [ "${{ matrix.mode }}" = copy ]; then
            # Espressif's documented fix for a PPA hang with TRIPLE_PARTIAL and
            # rotation. Written for ESP-IDF v6.0; applied here only if it fits.
            if git -C "$IDF_PATH" apply --check "$ADAPTER/0001-bugfix-ppa-Temporary-fix-for-the-PPA-hang-issue.patch"; then
              git -C "$IDF_PATH" apply "$ADAPTER/0001-bugfix-ppa-Temporary-fix-for-the-PPA-hang-issue.patch"
              echo "PPA hang patch applied to ESP-IDF"
            else
              echo "PPA hang patch does not apply to this ESP-IDF; built without it"
            fi
          fi
          python3 ppa/espressif/${{ matrix.board }}/prepare.py "$ADAPTER/test_apps/lvgl9" "${{ matrix.mode }}" "${{ matrix.angle }}"
      - name: Build
        shell: bash
        run: |
          set -e
          . "$IDF_PATH/export.sh" > /dev/null
          cd iots/components/display/tools/esp_lvgl_adapter/test_apps/lvgl9
          WS=$GITHUB_WORKSPACE/ppa/espressif/${{ matrix.board }}/sdkconfig.board
          if [ "${{ matrix.mode }}" = rotate_in_draw ]; then
            DEFAULTS="sdkconfig.defaults;sdkconfig.ci.rotate_in_draw;$WS"
          else
            DEFAULTS="sdkconfig.defaults;$WS"
          fi
          idf.py -D IDF_TARGET=esp32p4 -D "SDKCONFIG_DEFAULTS=$DEFAULTS" build
          grep -E "^CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y" sdkconfig
          if [ "${{ matrix.mode }}" = rotate_in_draw ]; then
            grep -E "^CONFIG_ESP_LVGL_ADAPTER_ROTATE_IN_DRAW=y" sdkconfig
          else
            ! grep -E "^CONFIG_ESP_LVGL_ADAPTER_ROTATE_IN_DRAW=y" sdkconfig
          fi
          cd build
          python -m esptool --chip esp32p4 merge_bin -o "$GITHUB_WORKSPACE/${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.angle }}-${{ inputs.idf || 'v5.5.5' }}.bin" @flash_args
          cp ../sdkconfig "$GITHUB_WORKSPACE/sdkconfig-${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.angle }}-${{ inputs.idf || 'v5.5.5' }}"
          # The symbols, to read a crash's backtrace against this exact build.
          cp test_esp_lvgl_adapter_lvgl9.elf "$GITHUB_WORKSPACE/${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.angle }}-${{ inputs.idf || 'v5.5.5' }}.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.angle }}-${{ inputs.idf || 'v5.5.5' }}
          path: |
            ${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.angle }}-${{ inputs.idf || 'v5.5.5' }}.bin
            sdkconfig-${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.angle }}-${{ inputs.idf || 'v5.5.5' }}
            ${{ matrix.board }}-${{ matrix.mode }}-${{ matrix.angle }}-${{ inputs.idf || 'v5.5.5' }}.elf
