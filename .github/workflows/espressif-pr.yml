#
# esp-iot-solution PR #818 (upstream/espressif/), built the way Espressif's CI
# builds it: the PR's branch on youkorr/esp-iot-solution, and their lvgl9 test
# app compiled for the ESP32-P4 in Espressif's own ESP-IDF images -- the four
# their CI builds this test app with (.build_idf_ge_than_v5_5_5_with_pre_release
# in their .gitlab/ci/build.yml): v5.5.5, release-v6.0, release-v6.1 and
# latest -- with the new option on, and without it, to show the default build
# is unchanged.
name: Espressif pull request
on:
  push:
    paths:
      - "upstream/espressif/**"
      - ".github/workflows/espressif-pr.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of youkorr/esp-iot-solution to build"
        default: feat/esp_lvgl_adapter-rotate-in-draw
jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.5.5, release-v6.0, release-v6.1, latest]
        config: [rotate_in_draw, p4rev3]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: youkorr/esp-iot-solution
          ref: ${{ inputs.ref || 'feat/esp_lvgl_adapter-rotate-in-draw' }}
          path: eis
          sparse-checkout: |
            components/display/tools/esp_lvgl_adapter
            components/display/lcd/esp_lcd_ek79007
            components/button
      - name: The lvgl9 test app for esp32p4, ESP-IDF ${{ matrix.idf }}, sdkconfig.ci.${{ matrix.config }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd eis/components/display/tools/esp_lvgl_adapter/test_apps/lvgl9
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.${{ matrix.config }}" set-target esp32p4
          idf.py build
          grep -E "CONFIG_ESP_LVGL_ADAPTER_ROTATE_IN_DRAW|CONFIG_LV_DRAW_TRANSFORM_USE_MATRIX" sdkconfig || true
