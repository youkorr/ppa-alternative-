name: Pixel-exact against LVGL
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    # master moves; a break there is news, not a red release.
    continue-on-error: ${{ matrix.lvgl == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        lvgl: [v9.5.0, v9.6.0, master]
    steps:
      - uses: actions/checkout@v4
      - name: LVGL ${{ matrix.lvgl }}
        run: git clone --depth 1 -b ${{ matrix.lvgl }} https://github.com/lvgl/lvgl /tmp/lvgl
      - name: Every case
        run: make -C test -j4 LVGL=/tmp/lvgl run
      - name: The ESPHome component's test catches a broken component
        run: python3 test/esphome_mutants.py
      - name: LVGL alone, drawn whole and in bands
        run: test/build/ortho_test --lvgl-quirk
      - name: Under AddressSanitizer
        run: >-
          ASAN_OPTIONS=detect_leaks=0 make -C test -j4 LVGL=/tmp/lvgl BUILD=build-asan
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" run
      - name: Timings (a runner, not a board)
        run: make -C test LVGL=/tmp/lvgl bench

  esphome:
    # The example board validates and generates: lvgl_ortho's schema, its
    # refusal of a rotation left on lvgl:, and the three LVGL defines.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome==2026.10.0
      - name: esphome config
        run: |
          esphome config example/guition-lvgl-ortho.yaml
          esphome config example/guition-lvgl-ortho-panel-buffers.yaml

  compile:
    # The real thing: ESPHome builds both examples with ESP-IDF for an
    # ESP32-P4, lv_draw_ortho, lvgl_ortho and lvgl_bench included. Nobody
    # here has a board attached, so this is what says the C and C++ build for
    # the chip -- not that they run on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        example: [guition-lvgl-ortho.yaml, guition-lvgl-ortho-panel-buffers.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.esphome
            ~/.platformio
          key: esp-idf-${{ matrix.example }}-esphome-2026.10.0
      - run: pip install esphome==2026.10.0
      - name: esphome compile ${{ matrix.example }}
        run: esphome compile example/${{ matrix.example }}

  test-yaml:
    # yaml/test-lvgl.yaml, built with ESP-IDF for every board in both modes,
    # with youkorr/lvgl_9.5's lvgl as the boards use it. The components come
    # from this commit rather than from main, and the secrets are dummies.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [tab5, guition, waveshare]
        mode: [ortho, lvgl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome==2026.10.0
      - name: Use this commit's components
        run: |
          sed -i 's#  - source: github://youkorr/ppa-alternative-@main#  - source:\n      type: local\n      path: ../components#' yaml/test-lvgl.yaml
          grep -q "path: ../components" yaml/test-lvgl.yaml
          printf 'wifi_ssid: "test"\nwifi_password: "testtest"\napi_encryption_key: "kIuGSIsyjV6h5x0uC4ToRJKNJa6tRtjSFdbTB8PA36A="\n' > yaml/secrets.yaml
      - name: esphome compile, ${{ matrix.board }} in ${{ matrix.mode }} mode
        run: esphome -s board ${{ matrix.board }} -s mode ${{ matrix.mode }} compile yaml/test-lvgl.yaml
