#
# lv_draw_ortho as an ESP Component Registry component (registry/lv_draw_ortho).
# Every push that touches it packs it as the registry would and builds its
# example with ESP-IDF 5.5.6 against the registry's LVGL, so what is uploaded
# is what was built. Uploading is by hand: Run workflow, "upload" set to
# dry-run (the registry checks it and keeps nothing) or yes. It needs the
# repository secret IDF_COMPONENT_API_TOKEN, a token made at
# components.espressif.com (Settings > Tokens, scope write:components).
name: lv_draw_ortho component
on:
  push:
    paths:
      - "registry/lv_draw_ortho/**"
      - "components/lvgl_ortho/lv_draw_ortho*"
      - "tools/pack_lv_draw_ortho.py"
      - ".github/workflows/lv-draw-ortho-registry.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to the ESP Component Registry"
        type: choice
        options: ["no", "dry-run", "yes"]
        default: "no"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Stage and pack
        shell: bash
        run: |
          set -e
          . "$IDF_PATH/export.sh" > /dev/null
          python3 tools/pack_lv_draw_ortho.py /tmp/lv_draw_ortho
          compote component pack --name lv_draw_ortho --project-dir /tmp/lv_draw_ortho --dest-dir /tmp/dist
          tar -tzf /tmp/dist/lv_draw_ortho_*.tgz
      - name: Build the Waveshare 7B example
        shell: bash
        run: |
          set -e
          . "$IDF_PATH/export.sh" > /dev/null
          cd /tmp/lv_draw_ortho/examples/waveshare_7b
          idf.py set-target esp32p4
          idf.py build
          grep -E "^CONFIG_LV_DRAW_TRANSFORM_USE_MATRIX=y" sdkconfig
          ls -la build/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: lv_draw_ortho-package
          path: /tmp/dist/
  upload:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload != 'no'
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        shell: bash
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
        run: |
          set -e
          [ -n "$IDF_COMPONENT_API_TOKEN" ] || { echo "Set the repository secret IDF_COMPONENT_API_TOKEN first"; exit 1; }
          . "$IDF_PATH/export.sh" > /dev/null
          python3 tools/pack_lv_draw_ortho.py /tmp/lv_draw_ortho
          DRY=
          [ "${{ inputs.upload }}" = "dry-run" ] && DRY=--dry-run
          compote component upload --namespace youkorr --name lv_draw_ortho --project-dir /tmp/lv_draw_ortho \
            --commit-sha "$GITHUB_SHA" $DRY
