#
# The Tab5 test built with ESPHome's development branch, which is ahead of
# the release the main CI pins: a board updated to it meets what changed
# first. youkorr/lvgl_9.5's lvgl is cloned and patches/lvgl_9.5-*.patch
# applied to it, so a fix for a newer ESPHome can be proved here before it
# goes into that repository; once it is there, its patch is removed. Both
# modes: lvgl_ortho, and lvgl's own rotation, which goes through the fork's
# flush. A red run here is news about ESPHome dev, not a broken release.
name: ESPHome dev
on: [push, workflow_dispatch]
jobs:
  tab5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [ortho, lvgl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "git+https://github.com/esphome/esphome@dev"
      - run: esphome version
      - name: youkorr/lvgl_9.5, with this repository's patches for it
        run: |
          git clone --depth 1 -b claude/jolly-lamport-ERZOC https://github.com/youkorr/lvgl_9.5 /tmp/lvgl_9.5
          for p in patches/lvgl_9.5-*.patch; do
            [ -e "$p" ] || continue
            git -C /tmp/lvgl_9.5 apply "$PWD/$p"
            echo "applied $p"
          done
      - name: Local components, dummy secrets
        run: |
          python3 - <<'EOF'
          p = "yaml/tab5-test-lvgl.yaml"
          s = open(p).read()
          old = """  - source:
                type: git
                url: https://github.com/youkorr/lvgl_9.5
                ref: claude/jolly-lamport-ERZOC
              components: [lvgl]
            - source: github://youkorr/ppa-alternative-@main
              components: [lvgl_ortho, lvgl_bench]"""
          assert s.count(old) == 1, "the external_components block moved"
          new = """  - source:
                type: local
                path: /tmp/lvgl_9.5/components
              components: [lvgl]
            - source:
                type: local
                path: ../components
              components: [lvgl_ortho, lvgl_bench]"""
          s = s.replace(old, new).replace("  active_high: true\n", "")
          if "${{ matrix.mode }}" == "lvgl":
              # The file's own instructions for mode lvgl: no lvgl_ortho
              # block, the rotation on lvgl: instead.
              a = s.index("lvgl_ortho:\n")
              b = s.index("# ---", a)
              s = s[:a] + "".join("# " + l + "\n" for l in s[a:b].rstrip("\n").split("\n")) + s[b:]
              s = s.replace("  # rotation: 270        # mode lvgl only", "  rotation: 270          # mode lvgl only")
              assert "  rotation: 270          # mode lvgl only" in s
          open(p, "w").write(s)
          EOF
          printf 'wifi_ssid: "test"\nwifi_password: "testtest"\napi_encryption_key: "kIuGSIsyjV6h5x0uC4ToRJKNJa6tRtjSFdbTB8PA36A="\n' > yaml/secrets.yaml
      - name: esphome compile, mode ${{ matrix.mode }}
        run: esphome compile yaml/tab5-test-lvgl.yaml
