# A Guition JC8012P4A1 (800x1280 panel) used landscape, with LVGL drawing
# straight in the panel's orientation through lvgl_ortho. The two lines that
# matter are marked >>>; everything else is an ordinary ESPHome LVGL board.
# Validated with `esphome config` (ESPHome 2026.10.0). Not flashed.
esphome:
  name: guition-ortho

esp32:
  variant: esp32p4
  board: esp32-p4-evboard
  framework:
    type: esp-idf

psram:

external_components:
  - source:
      type: local
      path: ../components
    # From a board's own YAML instead:
    #   source: github://youkorr/ppa-alternative-@main
    components: [lvgl_ortho, lvgl_bench]

logger:

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    id: panel
    model: JC8012P4A1
    reset_pin: GPIO27

lvgl:
  # >>> NO rotation: here. It moves to lvgl_ortho below.
  buffer_size: 10%      # LVGL's own buffer is replaced; keep it small
  pages:
    - id: home
      widgets:
        - label:
            text: "LVGL, drawn in the panel's orientation"
            align: CENTER
        - canvas:
            id: camera_canvas
            width: 800
            height: 600
            x: 80
            y: 100

# >>> The turn, in ESPHome's degrees (the number lvgl: had).
lvgl_ortho:
  id: ortho
  rotation: 90

# How long a whole-screen redraw takes, in Home Assistant. Put the same lines
# in a firmware without lvgl_ortho to compare the two.
lvgl_bench:
  ms_per_frame:
    name: "LVGL ms per frame"
  max_fps:
    name: "LVGL max fps"

button:
  - platform: template
    name: "LVGL bench"
    on_press:
      - lvgl_bench.run: 10s

# A camera through youkorr/esphome_esp-video goes into the same window, turned
# once by the PPA, with one line on its lvgl_camera_display block:
#
#   lvgl_camera_display:
#     camera_id: my_cam
#     canvas_id: camera_canvas
#     ortho_id: ortho
