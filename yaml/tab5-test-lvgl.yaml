#
# test-lvgl.yaml for the M5Stack Tab5 in ONE file: no boards/ or modes/ to
# copy beside it. Flash it, press "LVGL bench" in Home Assistant and read
# "LVGL ms per frame". Then change the MODE block below, flash, press again.
#
#   mode ortho         as it is
#   mode ortho_2cores  uncomment "cores: 2"
#   mode ortho_cpu     ppa: false
#   mode tiles         uncomment "tile_width: 256" (then try 128)
#   mode panel_fbs     the panel's own frame buffers, nothing copied: uncomment
#                      "framebuffers: 3" under display:, and make the first
#                      external_components list "components: [lvgl, mipi_dsi]"
#   mode lvgl          comment out the whole lvgl_ortho: block and uncomment
#                      "rotation: 270" under lvgl: further down; use_ppa and
#                      use_ppa_img may be true there to compare the fork's PPA
#
# Needs secrets.yaml with wifi_ssid, wifi_password and api_encryption_key.

# ---- MODE ---------------------------------------------------------------
lvgl_ortho:
  id: ortho
  rotation: 270          # the Tab5 in landscape (ESPHome's degrees)
  ppa: true              # false: mode ortho_cpu
  # cores: 2             # mode ortho_2cores
  # tile_width: 256      # mode tiles
# -------------------------------------------------------------------------

esphome:
  name: lvgl-test
  friendly_name: LVGL test

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl]   # mode panel_fbs: [lvgl, mipi_dsi]
  - source: github://youkorr/ppa-alternative-@main
    components: [lvgl_ortho, lvgl_bench]

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# The figures, in Home Assistant and in the log:
#   [I][lvgl_bench]: ... ms each, worst ... ms -> at most ... fps
lvgl_bench:
  ms_per_frame:
    name: "LVGL ms per frame"
  max_fps:
    name: "LVGL max fps"

button:
  - platform: template
    name: "LVGL bench"
    on_press:
      - lvgl_bench.run: 10s

# An ordinary interface: text, rounded cards with borders and shadows, a
# gradient, an arc, a bar, a slider and a switch -- what a dashboard is made
# of. lvgl_bench.run redraws all of it on every refresh.
lvgl:
  # rotation: 270        # mode lvgl only, with the lvgl_ortho: block above commented out
  displays:
    - panel
  buffer_size: 100%
  color_depth: 16
  byte_order: little_endian
  # false beside lvgl_ortho: the fork's PPA blending and lvgl_ortho's turns
  # stalled the PPA on a Tab5. True only in mode lvgl, to compare.
  use_ppa: false
  use_ppa_img: false
  style_definitions:
    - id: card
      bg_color: 0x1E2633
      border_color: 0x3A4A63
      border_width: 2
      radius: 16
      shadow_color: 0x000000
      shadow_width: 24
      shadow_opa: 60%
      shadow_offset_y: 6
      pad_all: 12
  pages:
    - id: test_page
      bg_color: 0x0B1220
      bg_grad_color: 0x23345A
      bg_grad_dir: VER
      pad_all: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: SPACE_EVENLY
        flex_align_track: CENTER
        pad_row: 16
        pad_column: 16
      widgets:
        - label:
            width: 100%
            text: "LVGL test -- Tab5"
            text_color: 0xFFFFFF
            text_font: montserrat_28
        - obj:
            styles: card
            width: 30%
            height: 34%
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "Salon"
                  text_color: 0xDDE6F5
                  text_font: montserrat_20
              - arc:
                  align: CENTER
                  width: 60%
                  height: 75%
                  value: 65
                  arc_color: 0x334155
                  indicator:
                    arc_color: 0xF59E0B
              - label:
                  align: CENTER
                  text: "21.5 °C"
                  text_color: 0xFFFFFF
        - obj:
            styles: card
            width: 30%
            height: 34%
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "Lumiere"
                  text_color: 0xDDE6F5
                  text_font: montserrat_20
              - switch:
                  align: CENTER
                  state:
                    checked: true
              - slider:
                  align: BOTTOM_MID
                  width: 85%
                  value: 40
        - obj:
            styles: card
            width: 30%
            height: 34%
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "Batterie"
                  text_color: 0xDDE6F5
                  text_font: montserrat_20
              - bar:
                  align: CENTER
                  width: 85%
                  height: 18%
                  value: 72
              - label:
                  align: BOTTOM_MID
                  text: "72 %, 1.4 kW"
                  text_color: 0xFFFFFF
        - button:
            styles: card
            width: 22%
            height: 16%
            widgets:
              - label:
                  align: CENTER
                  text: "Scene soir"
        - button:
            styles: card
            width: 22%
            height: 16%
            widgets:
              - label:
                  align: CENTER
                  text: "Volets"
        - button:
            styles: card
            width: 22%
            height: 16%
            widgets:
              - label:
                  align: CENTER
                  text: "Musique"
        - label:
            width: 100%
            text: "Le texte compte aussi : beaucoup de petites lettres, sur un fond en degrade, comme un vrai tableau de bord."
            text_color: 0xB8C4D9
            long_mode: WRAP

# ---- The board: M5Stack Tab5 (boards/tab5.yaml) --------------------------
esp32:
  variant: esp32p4
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: true
  slot: 1

esp_ldo:
  - voltage: 2.5V
    channel: 3

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43

display:
  - platform: mipi_dsi
    id: panel
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    pixel_mode: 24
    # framebuffers: 3      # mode panel_fbs
    color_order: rgb

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz
