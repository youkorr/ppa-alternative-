# Guition JC8012P4A1: 800x1280 panel, used landscape (90). Read by
# test-lvgl.yaml.

substitutions:
  rotation: "90"

esp32:
  variant: esp32p4
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  speed: 200MHz

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    id: panel
    model: JC8012P4A1
    reset_pin: GPIO27
    color_order: RGB

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO23
    frequency: 100Hz
