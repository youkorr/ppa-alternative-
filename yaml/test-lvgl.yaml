esphome:
  name: ppa-alternative
  friendly_name: ppa_alternative

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  variant: esp32p4
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

logger:

api:
  encryption:
    key: "ScxwpmQ4re+4pbTQypImv0ZOX1qcqFdG4v+h+I4bi00="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ppa_alternative Fallback Hotspot
    password: "OPBWYrQYOQ95"

captive_portal:


# ---- MODE ---------------------------------------------------------------
lvgl_ortho:
  id: ortho
  rotation: 270          # the Tab5 in landscape (ESPHome's degrees)
  ppa: true              # false: mode ortho_cpu
  # cores: 2             # mode ortho_2cores
# -------------------------------------------------------------------------

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1


external_components:
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl]
  - source: github://youkorr/ppa-alternative-@main
    components: [lvgl_ortho, lvgl_bench]


pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 6: O - camera reset
    # 7: I - headphone detect
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

switch:

  - platform: gpio
    id: wifi_power
    name: "WiFi"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON
    inverted: False

  - platform: gpio
    id: wifi_antenna_int_ext
    internal: True
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0

  - platform: gpio
    id: usb_5v_power
    name: USB-A Power
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
    restore_mode: ALWAYS_ON      
  - platform: gpio
    id: camera_reset
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 6
    restore_mode: ALWAYS_ON  

  - platform: gpio
    id: interrupt_pin_toushsreen
    name: "interrupt_pin_toushscreen"
    pin:
      inverted: true
      number: GPIO23
    restore_mode: ALWAYS_ON  

lvgl_bench:
  ms_per_frame:
    name: "LVGL ms per frame"
  max_fps:
    name: "LVGL max fps"

button:
  - platform: template
    name: "LVGL bench"
    on_press:
      - lvgl_bench.run: 10s

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz    

# An ordinary interface: text, rounded cards with borders and shadows, a
# gradient, an arc, a bar, a slider and a switch -- what a dashboard is made
# of. lvgl_bench.run redraws all of it on every refresh.
lvgl:
  # rotation: 270        # mode lvgl only, with the lvgl_ortho: block above commented out
  displays:
    - panel
  buffer_size: 100%
  color_depth: 16
  byte_order: little_endian
  use_ppa: true
  use_ppa_img: true
  style_definitions:
    - id: card
      bg_color: 0x1E2633
      border_color: 0x3A4A63
      border_width: 2
      radius: 16
      shadow_color: 0x000000
      shadow_width: 24
      shadow_opa: 60%
      shadow_offset_y: 6
      pad_all: 12
  pages:
    - id: test_page
      bg_color: 0x0B1220
      bg_grad_color: 0x23345A
      bg_grad_dir: VER
      pad_all: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: SPACE_EVENLY
        flex_align_track: CENTER
        pad_row: 16
        pad_column: 16
      widgets:
        - label:
            width: 100%
            text: "LVGL test -- Tab5"
            text_color: 0xFFFFFF
            text_font: montserrat_28
        - obj:
            styles: card
            width: 30%
            height: 34%
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "Salon"
                  text_color: 0xDDE6F5
                  text_font: montserrat_20
              - arc:
                  align: CENTER
                  width: 60%
                  height: 75%
                  value: 65
                  arc_color: 0x334155
                  indicator:
                    arc_color: 0xF59E0B
              - label:
                  align: CENTER
                  text: "21.5 °C"
                  text_color: 0xFFFFFF
        - obj:
            styles: card
            width: 30%
            height: 34%
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "Lumiere"
                  text_color: 0xDDE6F5
                  text_font: montserrat_20
              - switch:
                  align: CENTER
                  state:
                    checked: true
              - slider:
                  align: BOTTOM_MID
                  width: 85%
                  value: 40
        - obj:
            styles: card
            width: 30%
            height: 34%
            widgets:
              - label:
                  align: TOP_LEFT
                  text: "Batterie"
                  text_color: 0xDDE6F5
                  text_font: montserrat_20
              - bar:
                  align: CENTER
                  width: 85%
                  height: 18%
                  value: 72
              - label:
                  align: BOTTOM_MID
                  text: "72 %, 1.4 kW"
                  text_color: 0xFFFFFF
        - button:
            styles: card
            width: 22%
            height: 16%
            widgets:
              - label:
                  align: CENTER
                  text: "Scene soir"
        - button:
            styles: card
            width: 22%
            height: 16%
            widgets:
              - label:
                  align: CENTER
                  text: "Volets"
        - button:
            styles: card
            width: 22%
            height: 16%
            widgets:
              - label:
                  align: CENTER
                  text: "Musique"
        - label:
            width: 100%
            text: "Le texte compte aussi : beaucoup de petites lettres, sur un fond en degrade, comme un vrai tableau de bord."
            text_color: 0xB8C4D9
            long_mode: WRAP

# ---- The board: M5Stack Tab5 (boards/tab5.yaml) --------------------------

display:
  - platform: mipi_dsi
    id: panel
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    pixel_mode: 16
    color_order: rgb
