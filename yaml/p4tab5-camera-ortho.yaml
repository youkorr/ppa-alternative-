#
# yaml/p4tab5-camera-ppa.yaml with one thing changed: how the screen is
# turned. The camera, its component (youkorr/esphome's esp_video_camera and
# lvgl_camera_display), the sdkconfig options and the frame rate cap are the
# same, so the two files compare the turn and nothing else.
#
#   p4tab5-camera-ppa.yaml    lvgl's rotation: 270, the fork's PPA
#   this file                 lvgl_ortho: LVGL draws in the panel's
#                             orientation, the camera frame is turned once by
#                             the PPA straight into the panel's own frame
#                             buffer (framebuffers: 3), nothing is copied
#
# No ortho_id is needed: lvgl_camera_display points the canvas at the frame,
# LVGL draws it as a picture, and lvgl_ortho turns a plain picture in one pass.
#
# The figures: the perf monitor on the screen, and in the log
#   [D][lvgl_camera_display]: 1280x720 to the canvas at N fps
#   [I][lvgl_ortho]: Last 10s: ... N screens/s shown ...
#
# Needs secrets.yaml with wifi_ssid, wifi_password and api_encryption_key.

esphome:
  name: p4-camera-ortho
  friendly_name: p4-camera-ortho

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    # ESP-IDF 5.5.6, ESPHome dev's default, refuses the camera on a P4 below
    # v3.0 (the Tab5 is v1.0): its CSI driver now asks for a format
    # conversion those revisions cannot do, and esp_video's fix
    # (esp-video-components 79ae611) is not in a release yet.
    version: 5.5.5
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_GDMA_ISR_IRAM_SAFE: y
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: "y"
      CONFIG_ESP_TASK_WDT_EN: "10"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
      CONFIG_SPIRAM_RODATA: "n"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_FATFS_LFN_STACK: "y"
      CONFIG_LWIP_SO_RCVBUF: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_VFS_SUPPORT_IO: "y"
      CONFIG_VFS_MAX_COUNT: "16"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_FATFS_LFN_HEAP: "y"
      DCONFIG_ESP_JPG_DECODE_ENABLE: "y"
      DCONFIG_ESPHOME_ENABLE_PNGLE: "1"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM: "16"
      CONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: "64"
      CONFIG_WIFI_RMT_AMPDU_TX_ENABLED: "y"
      CONFIG_WIFI_RMT_TX_BA_WIN: "32"
      CONFIG_WIFI_RMT_AMPDU_RX_ENABLED: "y"
      CONFIG_WIFI_RMT_RX_BA_WIN: "32"
      CONFIG_LWIP_UDP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65534"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65534"
      CONFIG_LWIP_TCP_SACK_OUT: "y"

logger:
  level: DEBUG
  logs:
    esp-idf: WARN
    esp_video_camera: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/esphome
      ref: esp_video_camera-lvgl
    components: [lvgl_camera_display, esp_video_camera]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl, mipi_dsi]
    refresh: 0s
  - source: github://youkorr/ppa-alternative-@main
    components: [lvgl_ortho]

# ---- What changed: the turn ---------------------------------------------
lvgl_ortho:
  id: ortho
  rotation: 270          # was lvgl: rotation: 270
  ppa: true
  cores: 2
# -------------------------------------------------------------------------

esp32_hosted:
  variant: esp32c6
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: true
  slot: 1

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    scan: true
    frequency: 400kHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

psram:
  mode: hex
  speed: 200MHz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # 4: O - lcd reset
    # 6: O - camera reset
  - id: pi4ioe2
    address: 0x44
    # 0: O - wifi_power

display:
  - platform: mipi_dsi
    id: main_display
    dimensions:
      height: 1280
      width: 720
    model: M5Stack-Tab5
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    framebuffers: 3      # was 1: LVGL draws into the panel's own buffers
    color_order: rgb

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON

esp_video_camera:
  id: video_camera
  name: Camera
  i2c_id: bsp_bus
  device: jpeg
  sensor_model: sc2356
  resolution: 1280x720
  jpeg_quality: 50
  max_framerate: 20

lvgl:
  displays:
    - main_display
  # no rotation: and no rotation_buffers_internal: lvgl_ortho turns
  color_depth: 16
  byte_order: little_endian
  # false beside lvgl_ortho: with them on, the PPA stalled on a Tab5
  use_ppa: false
  use_ppa_img: false
  perf_monitor: true
  pages:
    - id: camera_page
      widgets:
        - canvas:
            id: camera_canvas
            width: 1280
            height: 720

lvgl_camera_display:
  camera_id: video_camera
  canvas_id: camera_canvas

switch:
  # Releases the sensor's reset. Nothing answers on the bus until it is let go.
  - platform: gpio
    id: camera_reset
    name: Camera reset
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 6
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: wifi_power
    name: "WiFi"
    internal: true
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
