# Part of ppa-alternative: https://github.com/youkorr/ppa-alternative-
#
# The Tab5's camera on the whole screen through lvgl_ortho, and nothing else
# running: no voice, no H.264, no dashboard, so the figure is the camera's
# path alone. lvgl_camera_display points the canvas at each frame and LVGL
# draws it as a picture, which lvgl_ortho turns straight into the panel's own
# frame buffer (framebuffers: 3). With ortho_id: instead, each frame goes
# into lvgl_ortho's video window, turned by the PPA the same way.
#
# The figures, every 10 s in the log:
#   [I][lvgl_ortho]: Last 10s: ... N screens/s shown ...
#   [I][lvgl_camera_display]: === BENCHMARK (100 frames) === FPS: ...
# The sensor sends 30 frames a second at most (SC2356 at 1280x720).
#
# The camera's settings are those of yaml/habbit (1).yaml in
# youkorr/esphome_esp-video, the Tab5 they already run on. Built with
# ESPHome's own ESP-IDF, 5.5.6: esphome_esp-video's esp_video gives the CSI
# bridge the ISP's output as its input, which 5.5.6 requires on a P4 below
# v3.0 (the Tab5 is v1.0).
#
# Needs secrets.yaml with wifi_ssid, wifi_password and api_encryption_key.

lvgl_ortho:
  id: ortho
  rotation: 270          # the Tab5 in landscape (ESPHome's degrees)
  ppa: true
  cores: 2
  # true shares each frame's turn between the PPA and both cores: measured
  # slower on a Tab5 (14.0 frames/s against 15.6), the PSRAM being the limit.
  split: false

esphome:
  name: camera-test
  friendly_name: Camera test
  on_boot:
    # After every component's setup: the canvas exists, the camera runs.
    priority: -100
    then:
      # Black until the first frame: a canvas's buffer is never cleared, and
      # left alone it shows whatever PSRAM held -- stripes, not a camera.
      - lvgl.canvas.fill:
          id: camera_canvas
          color: 0x000000
      - lambda: |-
          id(camera_display).configure_canvas(id(camera_canvas));
          // lvgl_camera_display draws nothing until the camera streams, and
          // nothing starts the stream on its own.
          if (!id(tab5_cam).start_streaming())
            ESP_LOGE("camera_test", "The camera would not stream; see esp_cam_sensor above");
          id(camera_display).set_enabled(true);

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl, mipi_dsi]
  - source: github://youkorr/ppa-alternative-@main
    components: [lvgl_ortho]
  - source:
      type: git
      url: https://github.com/youkorr/esphome_esp-video
      # main: its esp_video starts the camera on ESP-IDF 5.5.6 on a P4 below v3.0
      ref: main
    components: [esp_video, esp_cam_sensor, lvgl_camera_display]

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON

switch:
  # Off and on again in Home Assistant: the camera stops and starts, so the
  # same firmware also shows what the screen costs without it.
  - platform: template
    name: "Camera on screen"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: |-
          id(tab5_cam).start_streaming();
          id(camera_display)->set_enabled(true);
    turn_off_action:
      - lambda: |-
          id(camera_display)->set_enabled(false);
          id(tab5_cam).stop_streaming();
  - platform: gpio
    id: cam_rst
    name: "Camera reset"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 6
    restore_mode: ALWAYS_ON

# ---- The camera (as in habbit (1).yaml) ------------------------------------
esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_jpeg: true
  enable_isp: true
  use_heap_allocator: false

esp_cam_sensor:
  id: tab5_cam
  i2c_id: bsp_bus
  sensor_type: sc2356
  resolution: "1280x720"
  pixel_format: "RGB565"
  framerate: 30
  jpeg_quality: 15
  mirror_x: false
  mirror_y: false
  rotation: 0
  crop_offset_x: 0
  ppa_enabled: false

lvgl_camera_display:
  id: camera_display
  camera_id: tab5_cam
  canvas_id: camera_canvas
  update_interval: 16ms
  # Left out so LVGL draws each frame as a picture, which split shares
  # between the PPA and the CPU. Put back to send frames into lvgl_ortho's
  # video window instead: the PPA alone, 15 frames/s at 1280x720.
  # ortho_id: ortho

# The whole landscape screen is the camera's window.
lvgl:
  displays:
    - panel
  buffer_size: 100%
  color_depth: 16
  byte_order: little_endian
  use_ppa: false
  use_ppa_img: false
  pages:
    - id: camera_page
      bg_color: 0x000000
      widgets:
        - canvas:
            id: camera_canvas
            x: 0
            y: 0
            width: 1280
            height: 720
            bg_color: 0x203040

# ---- The board: M5Stack Tab5 (as in tab5-test-lvgl.yaml) --------------------
esp32:
  variant: esp32p4
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

esp32_hosted:
  variant: esp32c6
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: true
  slot: 1

esp_ldo:
  - voltage: 2.5V
    channel: 3

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43

display:
  - platform: mipi_dsi
    id: panel
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    pixel_mode: 24
    framebuffers: 3
    color_order: rgb

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz
